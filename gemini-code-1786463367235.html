<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metsästysalueet & Maastokartta</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Draw CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- Turf.js pinta-alalaskentaa varten -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #2e4d25;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        #header h1 {
            margin: 0;
            font-size: 1.2rem;
        }
        .controls button, .controls label {
            background-color: #4a7c3d;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .controls button:hover, .controls label:hover {
            background-color: #5c994c;
        }
        #file-input {
            display: none;
        }
        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Metsästysalueet & Maastokartta</h1>
        <div class="controls">
            <button onclick="exportGeoJSON()">Lataa alueet (GeoJSON)</button>
            <label for="file-input">Tuo alueet</label>
            <input type="file" id="file-input" accept=".geojson, .json" onchange="importGeoJSON(event)">
        </div>
    </div>

    <div id="map"></div>

    <script>
        // 1. Alustetaan kartta (keskitetty Suomeen)
        const map = L.map('map').setView([62.6, 29.8], 9);

        // 2. Karttatasot
        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap'
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Asetetaan maastokartta oletukseksi
        topoLayer.addTo(map);

        L.control.layers({
            "Maastokartta (OpenTopoMap)": topoLayer,
            "Peruskartta (OSM)": osmLayer
        }).addTo(map);

        // 3. Piirrettyjen alueiden säilytyskerros
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // 4. Piirtotyökalut (Leaflet.draw)
        const drawControl = new L.Control.Draw({
            draw: {
                polygon: {
                    allowIntersection: false,
                    showArea: true,
                    shapeOptions: {
                        color: '#d9534f',
                        weight: 3,
                        fillOpacity: 0.3
                    }
                },
                polyline: false,
                circle: false,
                rectangle: false,
                marker: false,
                circlemarker: false
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        // 5. Uuden alueen luominen
        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            const geojson = layer.toGeoJSON();

            // Lasketaan pinta-ala Turf.js:llä (m2 -> hehtaarit)
            const areaInSqMeters = turf.area(geojson);
            const areaInHectares = (areaInSqMeters / 10000).toFixed(2);

            // Kysytään alueen nimi
            const name = prompt("Anna alueen / reviirin nimi:", "Metsästysalue") || "Nimetön alue";

            // Tallennetaan ominaisuudet
            layer.feature = layer.feature || { type: 'Feature', properties: {} };
            layer.feature.properties.name = name;
            layer.feature.properties.area_ha = areaInHectares;

            // Lisätään opaste
            layer.bindPopup(`<b>${name}</b><br>Pinta-ala: ${areaInHectares} ha`);
            drawnItems.addLayer(layer);
        });

        // 6. Lataa alueet tiedostoon (GeoJSON Export)
        function exportGeoJSON() {
            const data = drawnItems.toGeoJSON();
            if (data.features.length === 0) {
                alert("Ei piirrettyjä alueita ladattavaksi.");
                return;
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'metsastysalueet.geojson';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 7. Tuo alueet tiedostosta (GeoJSON Import)
        function importGeoJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const geojson = JSON.parse(e.target.result);
                    L.geoJSON(geojson, {
                        style: {
                            color: '#d9534f',
                            weight: 3,
                            fillOpacity: 0.3
                        },
                        onEachFeature: function (feature, layer) {
                            const name = feature.properties?.name || "Nimetön alue";
                            const area = feature.properties?.area_ha || (turf.area(feature) / 10000).toFixed(2);
                            layer.bindPopup(`<b>${name}</b><br>Pinta-ala: ${area} ha`);
                            drawnItems.addLayer(layer);
                        }
                    });
                } catch (err) {
                    alert("Tiedoston lukeminen epäonnistui. Varmista, että kyseessä on kelvollinen GeoJSON-tiedosto.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
